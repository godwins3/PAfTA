<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Exodus - Reset Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .auth-container {
            max-width: 400px;
            margin: 100px auto;
        }
    </style>
</head>
<body>
    <div class="container auth-container">
        <h2 class="text-center mb-4">Reset Password</h2>
        <form id="resetPasswordForm">
            <div class="mb-3">
                <label for="newPassword" class="form-label">New Password</label>
                <input type="password" class="form-control" id="newPassword" required>
            </div>
            <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm New Password</label>
                <input type="password" class="form-control" id="confirmPassword" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Reset Password</button>
        </form>
        <div id="messageArea" class="mt-3 text-center"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('resetPasswordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const messageArea = document.getElementById('messageArea');

            if (newPassword !== confirmPassword) {
                messageArea.innerHTML = '<div class="alert alert-danger">Passwords do not match</div>';
                return;
            }

            // Get the reset token from the URL
            const urlParams = new URLSearchParams(window.location.search);
            const resetToken = urlParams.get('token');

            if (!resetToken) {
                messageArea.innerHTML = '<div class="alert alert-danger">Invalid reset token</div>';
                return;
            }

            fetch('/api/v1/reset-password', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ reset_token: resetToken, new_password: newPassword }),
            })
            .then(response => response.json())
            .then(data => {
                if (data.statusCode === 200) {
                    messageArea.innerHTML = '<div class="alert alert-success">Password reset successful. You can now <a href="login.html">login</a> with your new password.</div>';
                } else {
                    messageArea.innerHTML = `<div class="alert alert-danger">${data.Message}</div>`;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                messageArea.innerHTML = '<div class="alert alert-danger">An error occurred. Please try again.</div>';
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Exodus - Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .auth-container {
            max-width: 400px;
            margin: 100px auto;
        }
        #loadingIndicator {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container auth-container">
        <h2 class="text-center mb-4">Forgot Password</h2>
        <form id="forgotPasswordForm">
            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Reset Password</button>
        </form>
        <div id="loadingIndicator" class="text-center mt-3">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
        <div id="messageArea" class="mt-3 text-center"></div>
        <div class="mt-3 text-center">
            <a href="login.html">Back to Login</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const loadingIndicator = document.getElementById('loadingIndicator');
            const messageArea = document.getElementById('messageArea');

            loadingIndicator.style.display = 'block';
            messageArea.innerHTML = '';

            fetch('/api/v1/request-password-reset', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ email: email }),
            })
            .then(response => response.json())
            .then(data => {
                loadingIndicator.style.display = 'none';
                if (data.statusCode === 200) {
                    messageArea.innerHTML = '<div class="alert alert-success">Password reset instructions have been sent to your email.</div>';
                    document.getElementById('email').value = '';
                } else {
                    messageArea.innerHTML = `<div class="alert alert-danger">${data.Message}</div>`;
                }
            })
            .catch(error => {
                loadingIndicator.style.display = 'none';
                console.error('Error:', error);
                messageArea.innerHTML = '<div class="alert alert-danger">An error occurred. Please try again.</div>';
            });
        });
    </script>
</body>
</html>
